name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cargo test --locked --jobs 1
      - run: node --test web/*.test.mjs
